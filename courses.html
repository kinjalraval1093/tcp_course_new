<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>courses</title>
    <link rel="stylesheet" href="CSS/all.css">
    <link rel="stylesheet" href="CSS/bootstrap.min.css">

    <style>
     
      img
      {
        height: 400px;
      }
    </style>
</head>
<body>
    
  

    <div class="container">
       <div class="row">
        <div class="carousel slide" id="demo" data-bs-ride="carousel">
            <div class="carousel-indicators ">
                <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>

                <button type="button" data-bs-target="#demo" data-bs-slide-to="1" class=""></button>

                <button type="button" data-bs-target="#demo" data-bs-slide-to="2" class=""></button>
            </div>

            <div class="carousel-inner">

                <div class="carousel-item active">
                    <img src="images/card1.jpg"  alt="" class="d-block w-100 ">
                </div>

                <div class="carousel-item">
                    <img src="images/card2.jpg"  alt="" class="d-block w-100 ">
                </div>

                <div class="carousel-item">
                    <img src="images/card3.jpg"  alt="" class="d-block w-100 ">
                </div>

            </div>

            <button type="button" class="carousel-control-prev" data-bs-target="#demo"data-bs-slide="prev">
            <span class="carousel-control-prev-icon bg-primary"></span></button>

            <button type="button" class="carousel-control-next" data-bs-target="#demo" data-bs-slide="next">
            <span class="carousel-control-next-icon bg-primary"></span>
            </button>

        </div>
    </div>
            </div>

            <script src="JS/bootstrap.bundle.min.js"></script>
</body>
